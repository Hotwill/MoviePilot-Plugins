name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest==8.3.4 apscheduler==3.11.0 requests==2.32.3

      - name: Compile plugin sources
        run: python -m compileall -q plugins.v3 plugins.v2 plugins

      - name: Check index versions and mirrored implementations
        run: python scripts/sync_plugin.py --check

      - name: Run unit tests
        run: python -m pytest tests/v3 -q

      - name: Check whitespace errors
        run: git diff --check

  host-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout MoviePilot V3
        run: git clone --depth 1 https://github.com/jxxghp/MoviePilot.git /tmp/mp-v3

      - name: Checkout MoviePilot V2
        run: git clone --depth 1 -b v2 https://github.com/jxxghp/MoviePilot.git /tmp/mp-v2

      - name: Verify host imports resolve in both generations
        run: python scripts/check_host_imports.py /tmp/mp-v3 /tmp/mp-v2

  host-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout MoviePilot V3
        run: git clone --depth 1 https://github.com/jxxghp/MoviePilot.git /tmp/mp-v3

      - name: Install minimal backend dependencies
        run: pip install -r tests/host/requirements.txt

      - name: Real host load test
        env:
          MOVIEPILOT_BACKEND_PATH: /tmp/mp-v3
        run: python -m pytest tests/host -q

  host-load-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout MoviePilot V2
        run: git clone --depth 1 -b v2 https://github.com/jxxghp/MoviePilot.git /tmp/mp-v2

      - name: Install minimal backend dependencies
        run: pip install -r tests/hostv2/requirements.txt

      - name: Real V2 host load test
        env:
          MOVIEPILOT_V2_BACKEND_PATH: /tmp/mp-v2
        run: python -m pytest tests/hostv2 -q
